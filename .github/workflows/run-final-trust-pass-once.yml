name: Run final trust pass once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-final-trust-pass-once.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final trust pass
        run: |
          python scripts/final_trust_conversion_pass.py
          git diff --check
          grep -q 'trust-conversion.css' home-v2.html
          grep -q 'rp-trust-grid' home-v2.html
          grep -q 'term=deposit' home-v2.html
          grep -q 'id="faq"' home-v2.html
      - name: Commit
        run: |
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add home-v2.html
          git commit -m 'Raise homepage trust and conversion confidence'
          git push origin main
