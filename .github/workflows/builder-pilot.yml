name: Revenue Pilots Builder Pilot

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Cloud OS build job ID"
        required: true
        type: string
      company_id:
        description: "Cloud OS company ID"
        required: true
        type: string
      build_brief:
        description: "Structured BUILD_JOB brief"
        required: true
        type: string
      acceptance_criteria:
        description: "Acceptance criteria"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: builder-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_JOB_ID: ${{ inputs.job_id }}
      COMPANY_ID: ${{ inputs.company_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create isolated build branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="rp/build-${BUILD_JOB_ID}"
          git config user.name "Revenue Pilots Builder"
          git config user.email "builder@revenuepilot.company"
          git checkout -B "$BRANCH"
          echo "BUILD_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Persist build brief for worker
        shell: bash
        env:
          BUILD_BRIEF: ${{ inputs.build_brief }}
          ACCEPTANCE_CRITERIA: ${{ inputs.acceptance_criteria }}
        run: |
          set -euo pipefail
          mkdir -p .revenue-pilots/jobs
          cat > ".revenue-pilots/jobs/${BUILD_JOB_ID}.md" <<EOF
          # BUILD_JOB ${BUILD_JOB_ID}

          Company ID: ${COMPANY_ID}

          ## Build brief
          ${BUILD_BRIEF}

          ## Acceptance criteria
          ${ACCEPTANCE_CRITERIA}

          ## Required final behavior
          Follow CLAUDE.md. Work only in this branch. Do not merge or deploy production.
          EOF

      - name: Run Claude Code builder
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the Revenue Pilots Builder Pilot implementation worker.
            Read CLAUDE.md and .revenue-pilots/jobs/${{ inputs.job_id }}.md first.
            Implement only this BUILD_JOB. Keep all work on branch ${{ env.BUILD_BRANCH }}.
            Run the repository's available validation commands after implementation.
            Do not merge, do not deploy production, do not contact anyone, and do not touch secrets.
            When complete, leave the working tree with the scoped implementation ready to commit.

      - name: Run deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if command -v npm >/dev/null 2>&1; then
              if [ -f package-lock.json ]; then npm ci; else npm install --ignore-scripts; fi
              node -e 'const p=require("./package.json"); console.log(Object.keys(p.scripts||{}).join("\n"))' > /tmp/scripts.txt
              grep -qx lint /tmp/scripts.txt && npm run lint || true
              grep -qx typecheck /tmp/scripts.txt && npm run typecheck || true
              grep -qx test /tmp/scripts.txt && npm test -- --runInBand || true
              grep -qx build /tmp/scripts.txt && npm run build || true
            fi
          fi

      - name: Commit Builder Pilot changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by Builder Pilot."
            exit 1
          fi
          git commit -m "Builder Pilot: ${BUILD_JOB_ID}"
          git push --force-with-lease origin "$BUILD_BRANCH"

      - name: Open or update review pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --head "$BUILD_BRANCH" --base main --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          Automated Builder Pilot job: ${BUILD_JOB_ID}

          Company: ${COMPANY_ID}

          This PR is review-only. Production merge/deploy requires owner approval.
          EOF
          )
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY"
          else
            gh pr create --base main --head "$BUILD_BRANCH" --title "Builder Pilot: ${BUILD_JOB_ID}" --body "$BODY"
          fi
