name: Revenue Pilots Builder Pilot

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Cloud OS build job ID"
        required: true
        type: string
      company_id:
        description: "Cloud OS company ID"
        required: true
        type: string
      build_brief:
        description: "Structured BUILD_JOB brief"
        required: true
        type: string
      acceptance_criteria:
        description: "Acceptance criteria"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: builder-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_JOB_ID: ${{ inputs.job_id }}
      COMPANY_ID: ${{ inputs.company_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or resume isolated build branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="rp/build-${BUILD_JOB_ID}"
          git config user.name "Revenue Pilots Builder"
          git config user.email "builder@revenuepilot.company"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH:$BRANCH"
            git checkout "$BRANCH"
            git rebase origin/main
          else
            git checkout -b "$BRANCH"
          fi
          echo "BUILD_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Persist build brief for worker
        shell: bash
        env:
          BUILD_BRIEF: ${{ inputs.build_brief }}
          ACCEPTANCE_CRITERIA: ${{ inputs.acceptance_criteria }}
        run: |
          set -euo pipefail
          mkdir -p .revenue-pilots/jobs
          cat > ".revenue-pilots/jobs/${BUILD_JOB_ID}.md" <<EOF
          # BUILD_JOB ${BUILD_JOB_ID}

          Company ID: ${COMPANY_ID}

          ## Build brief
          ${BUILD_BRIEF}

          ## Acceptance criteria
          ${ACCEPTANCE_CRITERIA}

          ## Required final behavior
          Follow CLAUDE.md. Work only in this branch. Do not merge or deploy production.
          EOF

      - name: Run Claude Code builder
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the Revenue Pilots Builder Pilot implementation worker.
            Read CLAUDE.md and .revenue-pilots/jobs/${{ inputs.job_id }}.md first.
            Implement the BUILD_JOB now; do not stop at analysis or a plan.
            Use only Read, Glob, Grep, LS, Write and Edit for repository work. Do not use Bash or shell commands; deterministic validation runs after your step.
            Make only the scoped repository edits needed to satisfy the acceptance criteria.
            Do not merge, deploy production, contact anyone, or touch secrets/automation policy files.
            Before finishing, verify the requested implementation exists by reading the edited file(s), then give a concise summary.
          claude_args: |
            --max-turns 10
            --allowedTools "Edit,Read,Write,Glob,Grep,LS"

      - name: Enforce protected-file boundary
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            path="${line:3}"
            [ -z "$path" ] && continue
            case "$path" in
              .github/*|CLAUDE.md|.env|.env.*)
                echo "Builder attempted to modify protected path: $path"
                exit 1
                ;;
              .revenue-pilots/*)
                if [ "$path" != ".revenue-pilots/jobs/${BUILD_JOB_ID}.md" ]; then
                  echo "Builder attempted to modify protected control path: $path"
                  exit 1
                fi
                ;;
            esac
          done < <(git status --porcelain)

      - name: Run deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ] && command -v node >/dev/null 2>&1; then
            node -e 'const p=require("./package.json"); console.log(Object.keys(p.scripts||{}).join("\n"))' > /tmp/scripts.txt
            if grep -Eq '^(lint|typecheck|test|build)$' /tmp/scripts.txt; then
              if [ -f package-lock.json ]; then
                npm ci --ignore-scripts
              else
                npm install --ignore-scripts --package-lock=false
              fi
              if grep -qx lint /tmp/scripts.txt; then npm run lint; fi
              if grep -qx typecheck /tmp/scripts.txt; then npm run typecheck; fi
              if grep -qx test /tmp/scripts.txt; then npm test; fi
              if grep -qx build /tmp/scripts.txt; then npm run build; fi
            else
              echo "No lint/typecheck/test/build script declared; skipping dependency installation."
            fi
          else
            echo "No package.json/node validation suite detected; Vercel preview QA remains required."
          fi

      - name: Remove local dependency/build state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules .vercel

      - name: Commit and push Builder Pilot changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Builder produced no scoped file changes; refusing to create an empty review."
            exit 1
          fi
          git commit -m "Builder Pilot: ${BUILD_JOB_ID}"
          git push -u origin "$BUILD_BRANCH" --force-with-lease

      - name: Open or update review pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --head "$BUILD_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          Automated Builder Pilot job: ${BUILD_JOB_ID}

          Company: ${COMPANY_ID}

          This PR is review-only. Production merge/deploy requires owner approval for the exact reviewed commit SHA.
          EOF
          )
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY"
          else
            gh pr create --base main --head "$BUILD_BRANCH" --title "Builder Pilot: ${BUILD_JOB_ID}" --body "$BODY"
          fi
