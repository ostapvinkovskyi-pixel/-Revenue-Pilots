name: Remove Systems hover copy once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-system-hover-copy-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove overlapping Systems hover descriptions
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'SYSTEM NETWORK CLEAN HOVER' css/v4.css; then
            echo 'Cleanup already applied.'
            exit 0
          fi
          cat >> css/v4.css <<'EOF'

          /* SYSTEM NETWORK CLEAN HOVER — Sep 6
             Keep the seven node labels, but remove long hover copy that
             overlaps the center and neighboring labels. */
          .v4-net-desc{
            display:none !important;
          }
          EOF
          git diff --check
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/v4.css
          git commit -m 'Remove overlapping Systems hover descriptions'
          git push origin main
