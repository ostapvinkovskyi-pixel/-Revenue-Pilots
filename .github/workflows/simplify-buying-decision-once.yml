name: Simplify buying decision once

on:
  push:
    paths:
      - '.github/workflows/simplify-buying-decision-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplify homepage offers
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "Revenue Pilots Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add home-v2.html
          git commit -m "Simplify homepage buying decision"
          git push
