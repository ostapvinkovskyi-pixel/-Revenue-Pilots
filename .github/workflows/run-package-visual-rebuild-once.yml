name: Run package visual rebuild once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-package-visual-rebuild-once.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply rebuild
        run: |
          python scripts/rebuild_package_visuals.py
          git diff --check
          grep -q 'package-capabilities.css' home-v2.html
          grep -q 'v4-web-showcase' home-v2.html
          grep -q 'v4-sys-flow' home-v2.html
      - name: Commit
        run: |
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add home-v2.html
          git commit -m 'Upgrade Website and Systems package visuals'
          git push origin main
