name: Rebuild offer clarity and pricing once

on:
  push:
    paths:
      - '.github/workflows/rebuild-offer-clarity-pricing-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild pricing and offer clarity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: expected text not found')
              return text.replace(old, new, 1)

          # ---------------------------------------------------------------
          # Checkout: new flagship pricing + direct Signature deposit.
          # ---------------------------------------------------------------
          p = Path('api/checkout.js')
          text = p.read_text()
          old = '''  full_build: {\n    slug: "full_revenue_build",\n    name: "Revenue Pilots — Full Revenue Build",\n    amount: 750000,\n    depositAmount: 375000,\n    billing: "project",\n    description: "Full Revenue Build: creative, Conversion Website, and Revenue Systems built as one connected core package. Total project price is $7,500. Custom additions outside the core package are quoted separately."\n  }'''
          new = '''  full_build: {\n    slug: "full_revenue_build",\n    name: "Revenue Pilots — Full Revenue Build",\n    amount: 1200000,\n    depositAmount: 600000,\n    billing: "project",\n    description: "Full Revenue Build base package: a Cinematic Website, Revenue Systems, an agent-powered lead workflow, and Launch Creative built as one connected system. Launch Creative includes 8 original vertical ads plus 4 alternate hook cuts for 12 ad-ready exports. Base project price is $12,000. Exact providers, integrations and automation channels are confirmed during onboarding. Ad spend, paid talent, third-party subscriptions and custom additions outside the base scope are separate and approved before extra work begins."\n  },\n  signature_revenue_build: {\n    slug: "signature_revenue_build",\n    name: "Revenue Pilots — Signature Revenue Build",\n    amount: 1500000,\n    depositAmount: 750000,\n    billing: "project",\n    description: "Signature Revenue Build base package: everything in the Full Revenue Build, upgraded to a Signature Interactive Website with deeper bespoke interaction, custom visual production and more advanced workflow/integration architecture. Launch Creative includes 8 original vertical ads plus 4 alternate hook cuts for 12 ad-ready exports. Base project price is $15,000. Real-time 3D/WebGL, unusually complex production, advanced integrations, ad spend, paid talent and third-party subscriptions are included only when explicitly confirmed in the agreed scope or quoted separately before extra work begins."\n  }'''
          if 'amount: 1200000' not in text:
              text = replace_required(text, old, new, 'checkout flagship offer')
          text = text.replace('offer_version: "premium-deposit-ladder-2026-09"', 'offer_version: "clarified-revenue-builds-2026-09"')
          p.write_text(text)

          # ---------------------------------------------------------------
          # Homepage: make the buying ladder self-explanatory.
          # ---------------------------------------------------------------
          p = Path('home-v2.html')
          text = p.read_text()
          text = text.replace(
              'Creative Sprint $1,500 / 4 weeks · Conversion Website $3,500 · Revenue Systems $3,500 · Full Revenue Build $7,500.',
              'Creative Sprint $1,500 / 4 weeks · Websites from $3,500 · Revenue Systems $3,500 · Full Revenue Build $12,000 · Signature Revenue Build from $15,000.'
          )
          text = text.replace(
              '<article class="rp-trust-card"><small>Secure start</small><strong>Lower-risk project deposit</strong><p>Website, Systems and Full Build projects can start with a project deposit instead of requiring the full project price upfront.</p></article>',
              '<article class="rp-trust-card"><small>Secure start</small><strong>50% project deposits</strong><p>Project-based website, systems and revenue builds can start with a 50% deposit. The remaining base balance is due after approval, before final launch or delivery.</p></article>'
          )

          old = '''    <div class="v4-fullbuild">\n      <p class="v4-build-chain">Creative &rarr; Website &rarr; Systems</p>\n      <h3 class="v4-build-name">Full Revenue Build</h3>\n      <p class="v4-build-amount">$7,500</p>\n      <p class="v4-build-copy">All three layers scoped, built and connected as one system. $1,000 less than buying all three separately.</p>\n      <p class="rp-start-price" style="justify-content:center"><strong>$3,750 project deposit</strong><span>$7,500 total · $3,750 remaining before launch</span></p>\n      <a class="btn btn-gold btn-block v4-build-cta" href="/api/checkout?plan=full_build&amp;term=deposit"><span>Start Full Build &mdash; $3,750</span><span class="v4-build-arrow" aria-hidden="true">→</span></a>\n      <p class="v4-checkout-note v4-checkout-note-center">Secure Stripe checkout &middot; remaining $3,750 due before final launch</p>\n      <p class="v4-pkg-sub">Need something different? <a href="#contact">Custom Build &mdash; custom quote</a></p>\n    </div>'''
          new = '''    <div class="v4-fullbuild">\n      <p class="v4-build-chain">Cinematic Website &rarr; Agents &amp; Systems &rarr; Launch Creative</p>\n      <h3 class="v4-build-name">Full Revenue Build</h3>\n      <p class="v4-build-amount">$12,000</p>\n      <p class="v4-build-copy"><strong>One connected revenue system, not three disconnected services.</strong> You get a Cinematic Website, Revenue Systems, an agent-powered lead workflow, and a complete launch creative pack built around the same offer and customer journey.</p>\n      <p class="v4-build-copy"><strong>Included:</strong> Cinematic Website base · lead capture, qualification, routing and follow-up workflow · booking / pipeline handoff · 8 original launch ads + 4 hook cuts = 12 ad-ready exports · integration, QA and launch.</p>\n      <p class="rp-start-price" style="justify-content:center"><strong>$6,000 project deposit</strong><span>$12,000 base project · $6,000 remaining after approval, before launch</span></p>\n      <a class="btn btn-gold btn-block v4-build-cta" href="/api/checkout?plan=full_build&amp;term=deposit"><span>Start Full Revenue Build &mdash; $6,000</span><span class="v4-build-arrow" aria-hidden="true">→</span></a>\n      <p class="v4-checkout-note v4-checkout-note-center">Secure Stripe checkout · exact automation providers confirmed during onboarding · ad spend and third-party costs separate</p>\n      <p class="v4-pkg-sub">Need something smaller? Choose Website or Systems above.</p>\n    </div>'''
          if '$12,000 base project' not in text:
              text = replace_required(text, old, new, 'homepage Full Revenue Build')

          old = '''    <div class="rp-signature-wrap">\n      <div class="rp-signature-card">\n        <div class="rp-signature-grid">\n          <div>\n            <div class="rp-tier-kicker"><span>Signature Revenue Build</span><span class="rp-tier-badge">For premium / high-ticket businesses</span></div>\n            <h3>When the experience has to feel as valuable as the thing you sell.</h3>\n            <p class="rp-premium-price">From $9,500</p>\n            <p>A cinematic website, Revenue Systems and launch creative scoped as one premium build. Best for businesses selling high-value services, luxury projects or products where a standard website would undersell the offer.</p>\n            <ul class="rp-premium-list"><li>Cinematic website direction from the $5,500 tier</li><li>Lead capture, routing, booking and pipeline handoff</li><li>Launch creative concepts around the approved offer</li><li>Custom scope confirmed before any deposit is requested</li></ul>\n          </div>\n          <div class="rp-signature-actions">\n            <a class="btn btn-gold btn-block" href="#contact">Discuss a Signature Build</a>\n            <span class="rp-signature-note">Real-time 3D / WebGL or unusually complex production is quoted above the starting price when required.</span>\n          </div>\n        </div>\n      </div>\n    </div>'''
          new = '''    <div class="rp-signature-wrap">\n      <div class="rp-signature-card">\n        <div class="rp-signature-grid">\n          <div>\n            <div class="rp-tier-kicker"><span>Signature Revenue Build</span><span class="rp-tier-badge">Top-tier / bespoke</span></div>\n            <h3>The complete system, with a signature interactive experience at the front.</h3>\n            <p class="rp-premium-price">From $15,000</p>\n            <p>Everything in the $12K Full Revenue Build, upgraded from a Cinematic Website to our Signature Interactive level for businesses where the digital experience itself needs to be a competitive advantage.</p>\n            <ul class="rp-premium-list"><li>Signature Interactive Website base instead of the Cinematic tier</li><li>Agent-powered lead workflow + Revenue Systems</li><li>8 original launch ads + 4 hook cuts = 12 ad-ready exports</li><li>Deeper custom interaction, visual production and integration architecture</li><li>Real-time 3D / WebGL when explicitly included in the agreed base scope</li></ul>\n          </div>\n          <div class="rp-signature-actions">\n            <p class="rp-start-price"><strong>$7,500 project deposit</strong><span>50% of the $15,000 base scope</span></p>\n            <a class="btn btn-gold btn-block" href="/api/checkout?plan=signature_revenue_build&amp;term=deposit">Start Signature Revenue Build — $7,500</a>\n            <span class="rp-signature-note">Custom additions, unusually complex 3D / production, ad spend and third-party subscriptions are quoted separately before extra work begins.</span>\n          </div>\n        </div>\n      </div>\n    </div>'''
          if 'plan=signature_revenue_build' not in text:
              text = replace_required(text, old, new, 'homepage Signature Revenue Build')

          # FAQ clarity.
          text = text.replace(
              '<details><summary>Do I have to pay a $3,500 or $7,500 project in full upfront?</summary><p>No for Conversion Website, Cinematic Website, Signature Interactive, Revenue Systems and Full Revenue Build. Those projects can start with a project deposit that is applied to the advertised base project total. Creative Sprint remains a fixed $1,500 four-week package paid in full at checkout. Creative Engine and Creative Scale renew monthly until canceled.</p></details>',
              '<details><summary>Do I have to pay a project in full upfront?</summary><p>No. Conversion Website, Cinematic Website, Signature Interactive, Revenue Systems, Full Revenue Build and Signature Revenue Build can start with a 50% project deposit. The remaining base balance is due after approval, before final launch or delivery. Creative Sprint is paid in full; Creative Engine and Creative Scale renew monthly until canceled.</p></details>'
          )
          insert_after = '<details><summary>What happens after I pay?</summary><p>We begin onboarding using the contact details from checkout, confirm the agreed core scope and required access, then move into the first working direction. Remaining project balance is handled before final launch/delivery where a deposit option was used.</p></details>'
          extra = insert_after + '\n      <details><summary>What exactly do I get in the $12,000 Full Revenue Build?</summary><p>A Cinematic Website, Revenue Systems, an agent-powered lead workflow, and Launch Creative: 8 original vertical ads plus 4 hook cuts for 12 ad-ready exports. We connect the customer-facing website to the agreed lead capture, qualification, routing, follow-up, booking and pipeline handoff. Exact providers and automation channels are confirmed during onboarding. Ad spend, paid talent, third-party subscriptions and custom additions are separate.</p></details>\n      <details><summary>What makes the $15,000 Signature Revenue Build different?</summary><p>It includes everything in the Full Revenue Build but upgrades the website to our Signature Interactive level and allows deeper bespoke interaction, visual production and integration architecture. Real-time 3D / WebGL is included only when it is explicitly part of the agreed base scope; unusually complex production or integrations are quoted separately before extra work begins.</p></details>'
          if 'What exactly do I get in the $12,000 Full Revenue Build?' not in text:
              text = replace_required(text, insert_after, extra, 'homepage FAQ insert')

          text = text.replace(
              '<option value="full_build">Full Revenue Build ($7,500)</option>',
              '<option value="full_build">Full Revenue Build ($12,000)</option>'
          )
          text = text.replace(
              '<option value="signature_revenue_build">Signature Revenue Build (from $9,500)</option>',
              '<option value="signature_revenue_build">Signature Revenue Build (from $15,000)</option>'
          )
          p.write_text(text)

          # ---------------------------------------------------------------
          # Dedicated Full Build page: rewrite the proposition clearly.
          # ---------------------------------------------------------------
          p = Path('full-build/index.html')
          text = p.read_text()
          replacements = [
              ('<title>Full Revenue Build — $7,500 — Revenue Pilots</title>', '<title>Full Revenue Build — $12,000 — Revenue Pilots</title>'),
              ('<meta name="description" content="Full Revenue Build $7,500, or Signature Revenue Build from $9,500 for businesses that need a cinematic website, customer system and launch creative built as one premium experience.">', '<meta name="description" content="Full Revenue Build $12,000: Cinematic Website, agent-powered Revenue Systems and 12 launch creative exports. Signature Revenue Build from $15,000 upgrades the experience to our bespoke interactive tier.">'),
              ('<meta property="og:description" content="Website, customer system and launch creative — one connected Full Revenue Build for $7,500.">', '<meta property="og:description" content="Cinematic Website, agent-powered Revenue Systems and 12 launch creative exports — one connected Full Revenue Build for $12,000.">'),
              ('Start Full Build — $3,750 deposit', 'Start Full Build — $6,000 deposit'),
              ('<h1 class="section-title reveal" style="font-size:clamp(34px,5.5vw,58px);max-width:18ch;">One build. Website, customer system, and launch creative.</h1>', '<h1 class="section-title reveal" style="font-size:clamp(34px,5.5vw,58px);max-width:18ch;">One connected system from first click to follow-up.</h1>'),
              ('<p class="section-sub reveal" style="max-width:60ch;font-size:17px;">The flagship package for a business that wants one partner instead of three vendors who don\'t talk to each other. The core Full Revenue Build is $7,500 — $1,000 less than buying the Creative Sprint, Conversion Website and Revenue Systems separately. Start with a $3,750 project deposit; the remaining $3,750 is due before final launch of the agreed core scope.</p>', '<p class="section-sub reveal" style="max-width:66ch;font-size:17px;">The flagship Revenue Pilots package for businesses that want more than a new website. We build the front end that wins trust, the agent-powered workflow that handles the next step, and the launch creative that feeds attention into the system. Base project: $12,000. Start with a $6,000 deposit; the remaining $6,000 is due after approval, before final launch.</p>'),
              ('Start Full Revenue Build — $3,750', 'Start Full Revenue Build — $6,000'),
              ('<header class="section-head"><p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>What\'s inside</p><h2 class="section-title">Three pieces, built to work together.</h2></header>', '<header class="section-head"><p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>What you get</p><h2 class="section-title">Website, agents and creative — connected around one customer journey.</h2><p class="section-sub">The $12K base scope is designed to be understandable before you pay: one premium front end, one operational lead system, and one launch creative pack.</p></header>'),
              ('<div class="flow-step reveal"><span class="flow-step-num">Website</span><h3>Turns interest into action.</h3><p>A conversion-focused site built around your real offer, customers and service area.</p></div>', '<div class="flow-step reveal"><span class="flow-step-num">Cinematic Website</span><h3>Makes the business feel worth choosing.</h3><p>A premium responsive website with custom visual direction, conversion architecture, lead capture, scroll storytelling and advanced motion.</p></div>'),
              ('<div class="flow-step reveal"><span class="flow-step-num">Customer system</span><h3>Captures and follows up.</h3><p>Booking, intake and follow-up scoped to what your stack actually supports.</p></div>', '<div class="flow-step reveal"><span class="flow-step-num">Agents + Revenue Systems</span><h3>Moves each enquiry toward a real next step.</h3><p>Lead capture, qualification, routing, acknowledgement/follow-up, booking handoff and pipeline updates using the providers confirmed in scope.</p></div>'),
              ('<div class="flow-step reveal"><span class="flow-step-num">Creative Sprint</span><h3>Gets the launch attention.</h3><p>8 original vertical ads over four weeks plus 4 alternate hook cuts, built around the approved offer and launch direction.</p></div>', '<div class="flow-step reveal"><span class="flow-step-num">Launch Creative</span><h3>Gives the system something to launch with.</h3><p>8 original vertical ads plus 4 alternate hook cuts = 12 ad-ready exports, with scripts/hooks, CTA copy, captions and social-ready formatting.</p></div>'),
              ('<p class="spec-disclosure" style="margin-top:22px;">The core Full Revenue Build is $7,500. Scope and timeline are confirmed before work begins; genuinely custom additions outside the core build are quoted separately.</p>', '<p class="spec-disclosure" style="margin-top:22px;"><strong>$12,000 base project.</strong> Includes integration and QA across the agreed website, workflow and launch creative. Ad spend, paid talent, third-party subscriptions and additions outside the base scope are separate and approved before extra work begins.</p>'),
              ('<p class="rp-premium-price">From $9,500</p>', '<p class="rp-premium-price">From $15,000</p>'),
              ('<p>Use this when the core $7,500 build is not visually ambitious enough. The Signature version pairs a Cinematic Website with Revenue Systems and launch creative so the front-end experience and the lead handling behind it feel like one premium system.</p>', '<p>Use this when the $12K Full Revenue Build is operationally right, but the front-end experience needs to be more bespoke. Signature upgrades the website to our Signature Interactive level and allows deeper custom interaction, visual production and integration architecture.</p>'),
              ('<ul class="rp-premium-list"><li>Cinematic Website direction from the $5,500 tier</li><li>Lead capture, routing, booking and pipeline handoff</li><li>Launch creative concepts built around the approved offer</li><li>Scope, integrations and visual production confirmed before deposit</li></ul>', '<ul class="rp-premium-list"><li>Everything in the $12K Full Revenue Build</li><li>Signature Interactive Website base instead of Cinematic</li><li>Agent-powered lead workflow + deeper integration architecture</li><li>8 original launch ads + 4 hook cuts = 12 ad-ready exports</li><li>Real-time 3D / WebGL when explicitly included in the agreed base scope</li></ul>'),
              ('<a class="btn btn-gold btn-block" href="#contact">Discuss Signature Revenue Build</a>', '<p class="rp-start-price"><strong>$7,500 project deposit</strong><span>50% of the $15,000 base scope</span></p><a class="btn btn-gold btn-block" href="/api/checkout?plan=signature_revenue_build&amp;term=deposit">Start Signature Revenue Build — $7,500</a>'),
              ('<span class="rp-signature-note">Real-time 3D / WebGL or unusually complex production can increase the scope above the $9,500 starting point.</span>', '<span class="rp-signature-note">Unusually complex 3D, production, advanced integrations, ad spend and third-party subscriptions are quoted separately before extra work begins.</span>'),
              ('<div class="contact-pitch reveal"><p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>Questions before buying?</p><h2 class="section-title">Want to confirm fit before the full build?</h2><p class="section-sub">Reserve the $7,500 core Full Revenue Build with a $3,750 project deposit above. The remaining $3,750 is due before final launch of the agreed core scope. If you need custom additions or want to confirm fit first, send the project brief here.</p></div>', '<div class="contact-pitch reveal"><p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>Questions before buying?</p><h2 class="section-title">Know the base scope before you start.</h2><p class="section-sub">Reserve the $12,000 Full Revenue Build with a $6,000 project deposit above, or the $15,000 Signature base with a $7,500 deposit. We then confirm business details, providers, access and any optional additions before extra work begins.</p></div>'),
              ('<option value="full_build" selected>Full Revenue Build ($7,500)</option>', '<option value="full_build" selected>Full Revenue Build ($12,000)</option>'),
              ('<option value="signature_revenue_build">Signature Revenue Build (from $9,500)</option>', '<option value="signature_revenue_build">Signature Revenue Build (from $15,000)</option>'),
              ('<p class="footer-disclosure">Website, customer system and launch creative — $7,500 core build. No performance guarantee.</p>', '<p class="footer-disclosure">Full Revenue Build $12,000 · Signature Revenue Build from $15,000 · ad spend and third-party costs separate · no performance guarantee.</p>')
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          p.write_text(text)

          # ---------------------------------------------------------------
          # Website page: same clear 50% deposit flow for every website tier.
          # ---------------------------------------------------------------
          p = Path('websites/index.html')
          text = p.read_text()
          text = text.replace(
              '<p>For businesses that need a serious custom website without a production-heavy interactive concept.</p>',
              '<p>For businesses that need a professional sales website: clear positioning, responsive design, lead capture and the core integrations required to move a visitor into the next step.</p>'
          )
          text = text.replace(
              '<p>For high-ticket services and premium brands where art direction, custom visuals and storytelling materially change how the company is perceived.</p>',
              '<p>Everything in Conversion Website, plus custom visual production, scroll-controlled storytelling and richer motion for businesses where the website itself needs to help justify a premium offer.</p>'
          )
          text = text.replace(
              '<a class="btn btn-ghost btn-block" href="#contact">Discuss Cinematic scope</a>',
              '<p class="rp-start-price"><strong>$2,750 project deposit</strong><span>50% of the $5,500 base scope</span></p><a class="btn btn-gold btn-block" href="/api/checkout?plan=cinematic_website&amp;term=deposit">Start Cinematic Website — $2,750</a>'
          )
          text = text.replace(
              '<p>For concepts that require custom interaction architecture, advanced scroll systems or real-time 3D / WebGL rather than a standard site build.</p>',
              '<p>Everything in the premium website direction, taken further with bespoke interaction architecture, advanced scroll/pointer systems and real-time 3D / WebGL when the agreed concept actually needs it.</p>'
          )
          text = text.replace(
              '<a class="btn btn-ghost btn-block" href="#contact">Plan a Signature build</a>',
              '<p class="rp-start-price"><strong>$3,750 project deposit</strong><span>50% of the $7,500 base scope</span></p><a class="btn btn-gold btn-block" href="/api/checkout?plan=signature_interactive&amp;term=deposit">Start Signature Interactive — $3,750</a>'
          )
          p.write_text(text)

          # ---------------------------------------------------------------
          # Main JS copy used in checkout/status labeling.
          # ---------------------------------------------------------------
          p = Path('js/main.js')
          text = p.read_text()
          text = text.replace('full_build: "Full Revenue Build ($7,500)"', 'full_build: "Full Revenue Build ($12,000)"')
          p.write_text(text)
          PY

      - name: Commit clarified pricing
        shell: bash
        run: |
          git config user.name "Revenue Pilots Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/checkout.js home-v2.html full-build/index.html websites/index.html js/main.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Clarify offers and raise flagship revenue build pricing"
          git push
