name: Run website pricing card rebuild once

on:
  push:
    paths:
      - '.github/workflows/run-rebuild-website-pricing-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild website pricing pane
        run: python scripts/rebuild_website_pricing_cards.py
      - name: Commit changes
        run: |
          git config user.name "Revenue Pilots Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add home-v2.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Match website offers to creative pricing layout"
          git push
