name: Run About contact separation once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-stack-about-contact-once.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply About/contact layout patch
        run: |
          python scripts/stack_about_contact.py
          git diff --check
          grep -q 'ABOUT / CONTACT SEPARATION' css/v4.css
      - name: Commit
        run: |
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/v4.css
          git commit -m 'Separate About and contact form visually'
          git push origin main
