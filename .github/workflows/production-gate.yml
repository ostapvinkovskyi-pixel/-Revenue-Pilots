name: Revenue Pilots Production Gate

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Approved Builder job ID"
        required: true
        type: string
      pr_number:
        description: "Pull request number approved by owner"
        required: true
        type: string
      approved_sha:
        description: "Exact PR head commit SHA approved by owner"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: production-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact approved PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT_SHA" != "$APPROVED_SHA" ]; then
            echo "Approval invalid: PR changed after owner approval."
            echo "Approved: $APPROVED_SHA"
            echo "Current:  $CURRENT_SHA"
            exit 1
          fi

      - name: Require exact successful Preview QA and Vercel status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail

          CHECKS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$APPROVED_SHA/check-runs")
          echo "$CHECKS" > /tmp/checks.json
          QA_SUCCESS=$(jq '[.check_runs[] | select(.name == "preview-smoke" and .conclusion == "success")] | length' /tmp/checks.json)
          QA_BAD=$(jq '[.check_runs[] | select(.name == "preview-smoke" and (.conclusion != "success"))] | length' /tmp/checks.json)

          if [ "$QA_SUCCESS" -lt 1 ] || [ "$QA_BAD" -gt 0 ]; then
            echo "Exact commit does not have a clean successful preview-smoke QA check."
            jq -r '.check_runs[] | select(.name == "preview-smoke") | "- \(.name): \(.conclusion)"' /tmp/checks.json
            exit 1
          fi

          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$APPROVED_SHA/status")
          echo "$STATUS" > /tmp/status.json
          VERCEL_SUCCESS=$(jq '[.statuses[] | select(.context == "Vercel" and .state == "success")] | length' /tmp/status.json)
          if [ "$VERCEL_SUCCESS" -lt 1 ]; then
            echo "Exact commit does not have a successful Vercel deployment status."
            exit 1
          fi

      - name: Merge only the approved commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$APPROVED_SHA"

      - name: Production handoff note
        shell: bash
        run: |
          echo "Approved Builder job ${{ inputs.job_id }} merged after exact-SHA Preview QA. Vercel production deployment is expected from the main-branch Git integration."
