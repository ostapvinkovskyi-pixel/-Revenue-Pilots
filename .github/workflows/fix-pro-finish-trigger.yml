name: Fix professional finish validation trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pro-finish-trigger.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix validation and retrigger finish
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pro-finish-once.yml')
          t = p.read_text()
          old = "grep -q 'plan=website' api/checkout.js"
          new = "grep -q 'website: {' api/checkout.js"
          if old not in t:
              raise SystemExit('Expected validation line not found')
          p.write_text(t.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-pro-finish-trigger.yml
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix professional finish validation'
          git push origin main
