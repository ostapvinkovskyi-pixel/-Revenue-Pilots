name: Polish Packages section once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-packages-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply focused Packages visual polish
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('css/v4.css')
          text = path.read_text()
          marker = 'PACKAGES PREMIUM POLISH — Sep 6'
          if marker not in text:
              block = base64.b64decode('').decode('utf-8')
              path.write_text(text.rstrip() + '\n\n' + block + '\n')
          PY
          rm -f .github/workflows/polish-packages-once.yml
          git diff --check
          grep -q 'PACKAGES PREMIUM POLISH' css/v4.css

      - name: Commit polished Packages section
        run: |
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/v4.css .github/workflows/polish-packages-once.yml
          git commit -m 'Polish Packages section presentation'
          git push origin main
