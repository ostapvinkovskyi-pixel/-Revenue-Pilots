name: Polish Packages section once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-packages-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply focused Packages visual polish
        run: |
          set -euo pipefail
          marker='PACKAGES PREMIUM POLISH — Sep 6'
          if grep -q "$marker" css/v4.css; then
            echo 'Packages polish already present.'
          else
            cat >> css/v4.css <<'CSS'

/* PACKAGES PREMIUM POLISH — Sep 6
   Focused presentation pass only: tighter card, larger previews, stronger
   hierarchy and cleaner CTAs. No pricing/content/checkout behaviour changes. */
#packages .v4-config{
  position:relative;
  isolation:isolate;
  max-width:1360px;
  margin:30px auto 0;
  padding:clamp(24px,2.8vw,38px);
  border:1px solid rgba(255,255,255,.11);
  border-radius:28px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.026),rgba(255,255,255,.006)),
    radial-gradient(75% 100% at 16% 0%,rgba(197,154,60,.09),transparent 62%),
    rgba(9,12,17,.88);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045),
    0 34px 90px rgba(0,0,0,.36);
  overflow:hidden;
}
#packages .v4-config::after{
  content:"";
  position:absolute;
  inset:auto 8% -1px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(197,154,60,.34),transparent);
  pointer-events:none;
}

#packages .v4-tabs{
  max-width:560px;
  margin:0 auto;
  padding:6px;
  border-color:rgba(255,255,255,.1);
  background:rgba(5,7,10,.72);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.03),
    0 14px 38px rgba(0,0,0,.24);
}
#packages .v4-tab-pill{
  top:6px;
  left:6px;
  height:calc(100% - 12px);
  background:linear-gradient(180deg,#d8b04f 0%,#b9862c 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,240,198,.28),
    0 8px 24px rgba(197,154,60,.26);
}
#packages .v4-ptab{
  min-height:48px;
  padding:0 12px;
  font-size:11px;
  letter-spacing:.16em;
}
#packages .v4-ptab[aria-selected="true"]{
  color:#0c0b08;
  text-shadow:0 1px 0 rgba(255,255,255,.12);
}

#packages .v4-config-body{
  margin-top:clamp(28px,3vw,40px);
}
#packages .v4-pkg-pane{
  grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);
  gap:clamp(36px,4vw,64px);
  align-items:center;
  min-height:410px;
}

#packages .v4-pkg-media{
  border-radius:22px;
  border:1px solid rgba(255,255,255,.1);
  background:
    radial-gradient(60% 80% at 50% 45%,rgba(197,154,60,.07),transparent 72%),
    linear-gradient(155deg,#0b0e13,#07090d 74%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 22px 60px rgba(0,0,0,.28);
}
#packages .v4-pkg-media.v4-pkg-media-mini{
  min-height:380px;
  padding:clamp(26px,3vw,42px);
}
#packages .v4-pkg-media-mini .rp-altura-mount{
  width:96%;
  max-width:640px;
  transform:scale(1.035);
  filter:drop-shadow(0 24px 38px rgba(0,0,0,.45));
}
#packages [data-pkg-pane="systems"] .v4-pkg-media-mini{
  background:
    radial-gradient(45% 62% at 50% 50%,rgba(197,154,60,.13),transparent 72%),
    linear-gradient(155deg,#0b0e13,#07090d 74%);
}
#packages [data-pkg-pane="systems"] .v4-net-sm{
  transform:scale(1.38);
  transform-origin:center;
  filter:drop-shadow(0 20px 30px rgba(197,154,60,.08));
}
#packages [data-pkg-pane="websites"] .v4-pkg-media::after,
#packages [data-pkg-pane="systems"] .v4-pkg-media::after{
  position:absolute;
  left:16px;
  bottom:14px;
  z-index:5;
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  background:rgba(7,9,13,.72);
  color:rgba(238,234,224,.62);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:8.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  backdrop-filter:blur(10px);
}
#packages [data-pkg-pane="websites"] .v4-pkg-media::after{ content:"Concept preview"; }
#packages [data-pkg-pane="systems"] .v4-pkg-media::after{ content:"Connected workflow"; }

#packages .v4-pkg-tiers{
  width:100%;
  max-width:540px;
  align-self:center;
  padding-left:clamp(28px,3vw,46px);
  border-left:1px solid rgba(255,255,255,.075);
}
#packages .v4-tier{
  position:relative;
  padding:6px 0;
}
#packages .v4-tier-kicker{ display:none; }
#packages .v4-tier::before{
  display:block;
  margin:0 0 11px;
  color:var(--gold);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
}
#packages [data-pkg-pane="creative"] .v4-tier::before{ content:"Creative"; }
#packages [data-pkg-pane="websites"] .v4-tier::before{ content:"Websites"; }
#packages [data-pkg-pane="systems"] .v4-tier::before{ content:"Systems"; }
#packages .v4-tier-name{
  margin-bottom:8px;
  font-size:clamp(24px,2.25vw,31px);
  letter-spacing:-.035em;
}
#packages .v4-tier-price{
  margin-bottom:24px;
  font-size:clamp(34px,3.2vw,44px);
  line-height:1;
  letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 8px 30px rgba(197,154,60,.12);
}
#packages .v4-tier-list{
  gap:10px;
  margin-bottom:28px;
}
#packages .v4-tier-list li{
  padding-left:22px;
  font-size:14.5px;
  line-height:1.45;
  color:rgba(221,224,231,.72);
}
#packages .v4-tier-list li::before{
  content:"✓";
  top:.02em;
  width:auto;
  height:auto;
  background:none;
  color:var(--gold-hi);
  font-size:12px;
  font-weight:800;
}

#packages .v4-tier .btn-block{
  position:relative;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 52px 0 24px;
  border-radius:14px;
  border:1px solid transparent;
  background:
    linear-gradient(180deg,rgba(17,20,26,.98),rgba(8,10,14,.98)) padding-box,
    linear-gradient(105deg,rgba(197,154,60,.42),rgba(240,216,154,.88),rgba(197,154,60,.42)) border-box;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.055),
    0 14px 34px rgba(0,0,0,.3);
  font-size:15px;
  font-weight:750;
  letter-spacing:-.01em;
  transition:transform .2s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease);
}
#packages .v4-tier .btn-block::before{
  content:"→";
  position:absolute;
  right:22px;
  top:50%;
  transform:translateY(-51%);
  color:var(--gold-hi);
  font-size:18px;
  line-height:1;
  transition:transform .22s var(--ease),color .22s var(--ease);
}
#packages .v4-tier .btn-block:hover{
  transform:translateY(-2px);
  background:
    linear-gradient(180deg,rgba(28,25,18,.98),rgba(11,11,12,.98)) padding-box,
    linear-gradient(105deg,#b98a31,#f0d89a,#b98a31) border-box;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.075),
    0 18px 42px rgba(197,154,60,.15);
}
#packages .v4-tier .btn-block:hover::before{
  color:#fff1c6;
  transform:translate(4px,-51%);
}

@media(max-width:1080px){
  #packages .v4-config{ max-width:820px; }
  #packages .v4-pkg-pane{
    grid-template-columns:1fr;
    min-height:0;
    gap:28px;
  }
  #packages .v4-pkg-media{ max-width:none; }
  #packages .v4-pkg-media.v4-pkg-media-mini{ min-height:320px; }
  #packages .v4-pkg-tiers{
    max-width:none;
    padding-left:0;
    border-left:0;
  }
}
@media(max-width:760px){
  #packages .v4-config{
    margin-top:22px;
    padding:18px;
    border-radius:20px;
  }
  #packages .v4-tabs{ max-width:none; padding:5px; }
  #packages .v4-tab-pill{ top:5px; left:5px; height:calc(100% - 10px); }
  #packages .v4-ptab{ min-height:42px; font-size:9.5px; letter-spacing:.1em; padding:0 5px; }
  #packages .v4-config-body{ margin-top:24px; }
  #packages .v4-pkg-media.v4-pkg-media-mini{ min-height:250px; padding:20px; border-radius:16px; }
  #packages [data-pkg-pane="systems"] .v4-net-sm{ transform:scale(1.08); }
  #packages .v4-tier-name{ font-size:23px; }
  #packages .v4-tier-price{ font-size:34px; margin-bottom:20px; }
  #packages .v4-tier-list li{ font-size:13.5px; }
  #packages .v4-tier .btn-block{ min-height:56px; padding-left:18px; padding-right:46px; }
}
@media(prefers-reduced-motion:reduce){
  #packages .v4-tier .btn-block,
  #packages .v4-tier .btn-block::before{ transition:none; }
}
CSS
          fi

          rm -f .github/workflows/polish-packages-once.yml
          git diff --check
          grep -q "$marker" css/v4.css

      - name: Commit polished Packages section
        run: |
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/v4.css .github/workflows/polish-packages-once.yml
          git commit -m 'Polish Packages section presentation'
          git push origin main
