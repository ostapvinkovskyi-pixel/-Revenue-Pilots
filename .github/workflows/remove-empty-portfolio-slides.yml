name: Remove empty portfolio slides

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-empty-portfolio-slides.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove the two placeholder portfolio cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          pattern = r'\n      <li class="work-card work-card--soon reveal">.*?</li>'
          updated, count = re.subn(pattern, '', text, flags=re.S)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 placeholder cards, found {count}')

          old_copy = "Category-specific advertising, not one template stretched across every business. Here's the same craft applied to five different industries."
          new_copy = "Category-specific advertising, not one template stretched across every business. Selected examples show the same craft applied across different industries."
          if old_copy not in updated:
              raise SystemExit('Expected portfolio copy was not found')
          updated = updated.replace(old_copy, new_copy, 1)

          path.write_text(updated)
          PY

      - name: Commit cleanup
        run: |
          git config user.name "Revenue Pilots Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Remove empty portfolio slides"
          git push origin main
