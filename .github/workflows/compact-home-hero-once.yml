name: Compact homepage hero once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-home-hero-once.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply compact desktop hero overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('css/v2.css')
          text = path.read_text()
          marker = '/* COMPACT DESKTOP HERO — Sep 6 */'
          block = textwrap.dedent(r'''
          /* COMPACT DESKTOP HERO — Sep 6 */
          @media (min-width: 1024px){
            .v2-hero{
              height:calc(100svh - var(--header-h));
              min-height:calc(100svh - var(--header-h));
              justify-content:flex-start;
              padding:24px var(--pad) 16px;
            }
            .v2-hero-copy{ max-width:940px; }
            .v2-eyebrow{
              margin-bottom:12px;
              font-size:10.5px;
            }
            .v2-h1{
              font-size:clamp(38px,3.75vw,54px);
              line-height:.98;
              max-width:22ch;
              margin-bottom:12px;
            }
            .v2-sub{
              max-width:60ch;
              font-size:clamp(14px,1.05vw,16px);
              line-height:1.42;
            }
            .v2-service-copy{
              margin-top:12px;
              min-height:82px;
              max-width:52ch;
            }
            .v2-service-name{
              margin-bottom:5px;
              font-size:10px;
            }
            .v2-promise{
              font-size:clamp(18px,1.55vw,21px);
              line-height:1.15;
              margin-bottom:5px;
            }
            .v2-desc{
              font-size:14px;
              line-height:1.4;
            }
            .v2-price{
              margin-top:6px;
              font-size:13.5px;
            }
            .v2-hero-cta{ margin-top:10px; }
            .v2-hero-cta .btn{
              min-height:44px;
              padding-top:10px;
              padding-bottom:10px;
            }
            .v2-stage{
              flex:0 0 clamp(205px,27vh,244px);
              min-height:0;
              margin-top:8px;
            }
            .v2-object{ width:min(28vw,360px); }
            .v2-object.is-left{
              transform:translate(-50%,-50%) translateX(-32vw) scale(.52) rotateY(13deg);
            }
            .v2-object.is-right{
              transform:translate(-50%,-50%) translateX(32vw) scale(.52) rotateY(-13deg);
            }
            .v2-object-label{ bottom:-16px; }
          }

          @media (min-width: 1024px) and (max-height: 800px){
            .v2-hero{ padding-top:16px; padding-bottom:10px; }
            .v2-eyebrow{ margin-bottom:8px; }
            .v2-h1{
              font-size:clamp(34px,3.3vw,48px);
              margin-bottom:9px;
            }
            .v2-sub{ font-size:14px; line-height:1.34; }
            .v2-service-copy{ margin-top:9px; min-height:74px; }
            .v2-hero-cta{ margin-top:8px; }
            .v2-stage{ flex-basis:clamp(180px,25vh,210px); margin-top:5px; }
            .v2-object{ width:min(26vw,330px); }
          }
          ''')
          if marker in text:
              raise SystemExit('Compact hero marker already present; refusing duplicate append')
          path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n')
          PY

      - name: Verify stylesheet diff
        run: |
          git diff --check
          grep -q 'COMPACT DESKTOP HERO' css/v2.css

      - name: Commit compact hero
        run: |
          git config user.name "Revenue Pilots Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add css/v2.css
          git commit -m "Compact homepage hero above the fold"
          git push origin main
