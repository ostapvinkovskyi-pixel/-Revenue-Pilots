name: Professional website audit once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pro-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Static buyer-facing audit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urlparse

          root = Path('.')
          html_files = sorted(root.rglob('*.html'))
          issues = []
          notes = []

          def add(level, file, msg):
              issues.append((level, str(file), msg))

          def resolve_target(file, href):
              raw = href.split('#',1)[0].split('?',1)[0]
              if not raw or raw.startswith(('http://','https://','mailto:','tel:','javascript:','data:')):
                  return None
              if raw.startswith('/api/'):
                  return None
              if raw.startswith('/'):
                  rel = raw.lstrip('/')
                  p = root / rel
              else:
                  p = file.parent / raw
              if str(p).endswith('/'):
                  p = p / 'index.html'
              elif p.is_dir():
                  p = p / 'index.html'
              elif not p.suffix:
                  if (p / 'index.html').exists():
                      p = p / 'index.html'
              return p

          homepage = Path('home-v2.html')
          home_text = homepage.read_text(encoding='utf-8') if homepage.exists() else ''
          home_ids = set(re.findall(r'\bid=["\']([^"\']+)["\']', home_text))

          stale_patterns = {
              '$249': 'stale $249 price',
              '$1,200': 'stale $1,200 price',
              '$2,500': 'stale $2,500 price',
              '$4,900': 'stale $4,900 price',
              '"price":"249"': 'stale JSON-LD price 249',
              '“price”:“249”': 'stale JSON-LD price 249',
          }

          fixed_buy_pages = {
              'websites/index.html': ('website', '$3,500'),
              'systems/index.html': ('systems', '$3,500'),
              'full-build/index.html': ('full_build', '$7,500'),
          }

          for file in html_files:
              text = file.read_text(encoding='utf-8', errors='replace')
              ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
              dup = sorted({x for x in ids if ids.count(x) > 1})
              for x in dup:
                  add('ERROR', file, f'duplicate id #{x}')

              if '<title>' not in text:
                  add('WARN', file, 'missing <title>')
              if 'name="description"' not in text:
                  add('WARN', file, 'missing meta description')
              if 'rel="canonical"' not in text and 'previews/' not in str(file):
                  add('WARN', file, 'missing canonical')

              for pat, msg in stale_patterns.items():
                  if pat in text:
                      add('ERROR', file, msg)

              if '/#services' in text and 'services' not in home_ids:
                  add('ERROR', file, 'links to /#services but homepage has no #services id')

              # Internal file/route links and assets
              for attr in ('href','src'):
                  for m in re.finditer(rf'{attr}=["\']([^"\']+)["\']', text):
                      value = m.group(1)
                      target = resolve_target(file, value)
                      if target is not None and not target.exists():
                          # root / is rewritten to home-v2.html, so allow it
                          if value == '/':
                              continue
                          add('ERROR', file, f'broken internal {attr}: {value} -> {target}')

              # Local #anchor links
              local_ids = set(ids)
              for anchor in re.findall(r'href=["\']#([^"\']+)["\']', text):
                  if anchor not in local_ids:
                      add('ERROR', file, f'broken local anchor #{anchor}')

              # Fixed-price service pages should have an actual checkout path
              key = str(file)
              if key in fixed_buy_pages:
                  plan, price = fixed_buy_pages[key]
                  if f'/api/checkout?plan={plan}' not in text:
                      add('BUSINESS', file, f'fixed-price {price} page has no direct checkout CTA')

              # Main fixed-price package buttons should be direct buy buttons.
              if file == homepage:
                  for plan, price in [('website','$3,500'),('systems','$3,500'),('full_build','$7,500')]:
                      if f'/api/checkout?plan={plan}' not in text:
                          add('BUSINESS', file, f'{price} package has no direct checkout path')

              # Generic weak CTA copy in package area
              if file == homepage and 'Start a Project</a>' in text:
                  notes.append('Homepage still uses generic “Start a Project” CTA copy in places; fixed packages should say Buy/Start + package name.')

          # JS syntax checked separately; scan obvious stale plan labels.
          js_main = Path('js/main.js').read_text(encoding='utf-8')
          if 'Growth ($499)' in js_main or 'Weekly Ad Engine ($999/mo)' in js_main:
              add('WARN', 'js/main.js', 'legacy Growth/Weekly checkout labels still present')

          checkout = Path('api/checkout.js').read_text(encoding='utf-8')
          for plan in ('website','systems','full_build'):
              if plan not in checkout:
                  add('BUSINESS', 'api/checkout.js', f'checkout API does not support {plan}')

          print('\n=== REVENUE PILOTS PROFESSIONAL AUDIT ===')
          print(f'HTML files scanned: {len(html_files)}')
          for level, file, msg in issues:
              print(f'[{level}] {file}: {msg}')
          if notes:
              print('\n=== NOTES ===')
              for n in sorted(set(notes)):
                  print('[NOTE]', n)
          print('\n=== TOTALS ===')
          for level in ('ERROR','BUSINESS','WARN'):
              print(level, sum(1 for x in issues if x[0] == level))
          PY

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in js/*.js api/*.js; do
            node --check "$f"
          done
          echo 'JS syntax: PASS'
