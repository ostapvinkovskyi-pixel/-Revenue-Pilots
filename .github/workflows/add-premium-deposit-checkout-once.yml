name: Add premium deposit checkout once

on:
  push:
    paths:
      - '.github/workflows/add-premium-deposit-checkout-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch premium website deposits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checkout = Path('api/checkout.js')
          text = checkout.read_text()
          anchor = '''  systems: {\n    slug: "revenue_systems",'''
          insert = '''  cinematic_website: {\n    slug: "cinematic_website",\n    name: "Revenue Pilots — Cinematic Website",\n    amount: 550000,\n    depositAmount: 275000,\n    billing: "project",\n    description: "Cinematic Website base package: everything in Conversion Website plus custom cinematic visual direction, scroll-controlled storytelling, advanced motion, and custom video/generated visual production as scoped. Base project price is $5,500. This deposit reserves the project and is applied to the base package total. Custom additions outside the base scope are quoted and approved separately before that extra work begins."\n  },\n  signature_interactive: {\n    slug: "signature_interactive",\n    name: "Revenue Pilots — Signature Interactive Website",\n    amount: 750000,\n    depositAmount: 375000,\n    billing: "project",\n    description: "Signature Interactive base package: bespoke interaction architecture, advanced scroll/pointer experiences, custom art direction, performance/mobile fallback planning, and real-time 3D/WebGL where included in the agreed base scope. Base project price is $7,500. This deposit reserves the project and is applied to the base package total. Unusually complex 3D, production, integrations or additions outside the base scope are quoted and approved separately before that extra work begins."\n  },\n  systems: {\n    slug: "revenue_systems",'''
          if 'cinematic_website:' not in text:
              if anchor not in text:
                  raise SystemExit('checkout anchor not found')
              text = text.replace(anchor, insert, 1)
              text = text.replace('offer_version: "creative-ladder-2026-09"', 'offer_version: "premium-deposit-ladder-2026-09"')
              checkout.write_text(text)

          home = Path('home-v2.html')
          text = home.read_text()
          old = '''                <a class="btn btn-gold btn-block" href="#contact">Discuss Cinematic Website</a>\n                <p class="rp-offer-note">Custom scope confirmed before any deposit</p>'''
          new = '''                <p class="rp-start-price"><strong>$2,750 project deposit</strong><span>50% of the $5,500 base scope · applied to your project</span></p>\n                <a class="btn btn-gold btn-block" href="/api/checkout?plan=cinematic_website&amp;term=deposit">Start Cinematic Website — $2,750</a>\n                <p class="rp-offer-note">Base project $5,500 · custom additions are quoted separately before extra work begins</p>'''
          if old not in text and 'plan=cinematic_website' not in text:
              raise SystemExit('cinematic card anchor not found')
          text = text.replace(old, new, 1)

          old = '''                <a class="btn btn-gold btn-block" href="#contact">Plan Signature Interactive</a>\n                <p class="rp-offer-note">Starting price · final scope quoted before work begins</p>'''
          new = '''                <p class="rp-start-price"><strong>$3,750 project deposit</strong><span>50% of the $7,500 base scope · applied to your project</span></p>\n                <a class="btn btn-gold btn-block" href="/api/checkout?plan=signature_interactive&amp;term=deposit">Start Signature Interactive — $3,750</a>\n                <p class="rp-offer-note">Base project $7,500 · unusually complex 3D / production is quoted separately before extra work begins</p>'''
          if old not in text and 'plan=signature_interactive' not in text:
              raise SystemExit('signature card anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              'No for Website, Revenue Systems and Full Revenue Build. Those projects can start with a project deposit that is applied to the advertised total.',
              'No for Conversion Website, Cinematic Website, Signature Interactive, Revenue Systems and Full Revenue Build. Those projects can start with a project deposit that is applied to the advertised base project total.'
          )
          home.write_text(text)

          success = Path('order-success/index.html')
          text = success.read_text()
          text = text.replace(
              'We’ll use the contact details entered at checkout to begin onboarding and confirm the agreed scope before the build starts.',
              'We’ll use the contact details entered at checkout to begin onboarding. For premium builds, the deposit reserves the base package; we then confirm details, integrations and any optional additions before extra work begins.'
          )
          text = text.replace('Send onboarding details', 'Complete onboarding details')
          success.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Revenue Pilots Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/checkout.js home-v2.html order-success/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add 50 percent deposits to premium website packages"
          git push
