name: Fix full compact homepage hero once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-full-compact-hero-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace clipped compact hero with full compact layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('css/v2.css')
          text = path.read_text()
          marker = '/* COMPACT DESKTOP HERO — Sep 6 */'
          if marker not in text:
              raise SystemExit('Old compact hero block not found')

          block = textwrap.dedent(r'''
          /* FULL COMPACT DESKTOP HERO — Sep 6 */
          @media (min-width: 1024px){
            .v2-hero{
              height:auto;
              min-height:calc(100svh - var(--header-h));
              justify-content:center;
              padding:calc(var(--header-h) + 18px) var(--pad) 24px;
            }
            .v2-hero-copy{ max-width:980px; }
            .v2-eyebrow{
              margin-bottom:10px;
              font-size:10.5px;
            }
            .v2-h1{
              font-size:clamp(40px,3.9vw,56px);
              line-height:.98;
              max-width:21.5ch;
              margin-bottom:10px;
            }
            .v2-sub{
              max-width:62ch;
              font-size:clamp(14.5px,1.08vw,16.5px);
              line-height:1.42;
            }
            .v2-service-copy{
              margin-top:12px;
              min-height:82px;
              max-width:54ch;
            }
            .v2-service-name{
              margin-bottom:5px;
              font-size:10px;
            }
            .v2-promise{
              font-size:clamp(19px,1.65vw,22px);
              line-height:1.16;
              margin-bottom:5px;
            }
            .v2-desc{
              font-size:14.5px;
              line-height:1.42;
            }
            .v2-price{
              margin-top:6px;
              font-size:14px;
            }
            .v2-hero-cta{ margin-top:10px; }
            .v2-hero-cta .btn{
              min-height:44px;
              padding-top:10px;
              padding-bottom:10px;
            }
            .v2-stage{
              flex:1 1 auto;
              min-height:clamp(260px,30vh,310px);
              margin-top:8px;
            }
            .v2-object{ width:min(30vw,392px); }
            .v2-object.is-left{
              transform:translate(-50%,-50%) translateX(-33vw) scale(.54) rotateY(13deg);
            }
            .v2-object.is-right{
              transform:translate(-50%,-50%) translateX(33vw) scale(.54) rotateY(-13deg);
            }
            .v2-object-label{ bottom:-20px; }
          }

          @media (min-width: 1024px) and (max-height: 800px){
            .v2-hero{
              padding-top:calc(var(--header-h) + 12px);
              padding-bottom:18px;
            }
            .v2-eyebrow{ margin-bottom:8px; }
            .v2-h1{
              font-size:clamp(36px,3.45vw,50px);
              margin-bottom:8px;
            }
            .v2-sub{ font-size:14px; line-height:1.34; }
            .v2-service-copy{ margin-top:9px; min-height:76px; }
            .v2-hero-cta{ margin-top:8px; }
            .v2-stage{
              min-height:clamp(230px,28vh,270px);
              margin-top:5px;
            }
            .v2-object{ width:min(29vw,370px); }
          }
          ''').strip()

          start = text.index(marker)
          path.write_text(text[:start].rstrip() + '\n\n' + block + '\n')
          PY

      - name: Verify stylesheet diff
        run: |
          grep -q 'FULL COMPACT DESKTOP HERO' css/v2.css
          ! grep -q '^/\* COMPACT DESKTOP HERO' css/v2.css
          git diff --check || true

      - name: Commit hero correction
        run: |
          git config user.name "Revenue Pilots Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add css/v2.css
          git commit -m "Keep homepage hero full while tightening spacing"
          git push origin main
