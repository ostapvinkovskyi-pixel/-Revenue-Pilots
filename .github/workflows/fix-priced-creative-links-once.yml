name: Fix priced creative links once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-priced-creative-links-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Send all explicit 1500 creative CTAs to checkout
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, html
          changed=[]
          pat=re.compile(r'(<a\b[^>]*href=["\'])/#packages(["\'][^>]*>)(.*?)(</a>)',re.I|re.S)
          def repl(m):
              label=' '.join(re.sub(r'<[^>]+>',' ',html.unescape(m.group(3))).split())
              if '$1,500' in label:
                  return m.group(1)+'/api/checkout?plan=starter&amp;term=one_time'+m.group(2)+m.group(3)+m.group(4)
              return m.group(0)
          for p in Path('.').rglob('*.html'):
              t=p.read_text(errors='replace')
              new=pat.sub(repl,t)
              if new!=t:
                  p.write_text(new); changed.append(str(p))
          print('Changed:',changed)
          # Fail if any explicit $1,500 anchor still detours to homepage packages.
          bad=[]
          for p in Path('.').rglob('*.html'):
              t=p.read_text(errors='replace')
              for m in pat.finditer(t):
                  label=' '.join(re.sub(r'<[^>]+>',' ',html.unescape(m.group(3))).split())
                  if '$1,500' in label: bad.append((str(p),label))
          if bad: raise SystemExit('Still-detouring explicit price CTAs: '+repr(bad))
          PY
          git diff --check
      - name: Commit priced CTA cleanup
        run: |
          set -euo pipefail
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*/*.html'
          git diff --cached --quiet && { echo 'No remaining cleanup needed'; exit 0; }
          git diff --cached --check
          git commit -m 'Send explicit creative price CTAs to checkout'
          git push origin main
