name: Final conversion polish once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-conversion-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final conversion and credibility polish
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Homepage hero: once a visitor has selected a fixed-price service,
          # the primary CTA should buy that service rather than adding a scroll step.
          p=Path('home-v2.html'); t=p.read_text()
          old='<a class="btn btn-gold" href="#packages">Choose a Package</a>'
          new='<a class="btn btn-gold" id="v2ServiceCta" href="/api/checkout?plan=starter&amp;term=one_time">Start Video Creative — $1,500</a>'
          if old not in t: raise SystemExit('Homepage hero CTA not found')
          t=t.replace(old,new,1)
          # Remove self-deprecating early-stage language without inventing proof.
          t=t.replace('We&rsquo;re early, so the promise is straightforward: clear scope, direct communication, honest proof and work built around the actual offer rather than a generic template.', 'The promise is straightforward: clear scope, direct communication, honest proof and work built around the actual offer rather than a generic template.')
          p.write_text(t)

          # About page should represent the actual three-part company, not only creative.
          p=Path('about/index.html'); t=p.read_text()
          t=t.replace('I build creative for businesses that deserve to be noticed.', 'I build digital systems that help good businesses look as strong online as the work they do.')
          t=t.replace('I started Revenue Pilots because I kept seeing the same problem: good businesses doing genuinely good work, but their advertising didn’t communicate that nearly as well as it could.', 'I started Revenue Pilots because I kept seeing the same problem: good businesses doing genuinely good work, but the path from attention to enquiry was often disconnected — the creative, the website and the follow-up were all treated as separate jobs.')
          t=t.replace('Revenue Pilots became a way to apply that same creative thinking to business.', 'Revenue Pilots became a way to apply that same creative thinking to the whole customer journey — from the first piece of content someone sees to the website they land on and the system that handles the opportunity next.')
          t=t.replace('My goal isn’t to sell companies more marketing for the sake of marketing. It’s to understand what makes a business valuable, find the clearest and strongest way to communicate it, and turn that into creative people actually want to watch.', 'My goal isn’t to sell companies more marketing for the sake of marketing. It’s to understand what makes a business valuable, find where the customer journey is losing momentum, and build the missing piece — creative, website or system — around the real offer.')
          t=t.replace('Revenue Pilots is still being built — intentionally. One business, one project, and one piece of great work at a time.', 'I keep Revenue Pilots deliberately hands-on: one clear scope, direct communication, and work I can stand behind instead of layers of account management between the client and the person building it.')
          p.write_text(t)

          # The flagship Video Creative page should have direct-link fallbacks even if JS fails.
          p=Path('video-ads/index.html'); t=p.read_text()
          t=t.replace('<button type="button" class="btn btn-gold btn-sm header-cta" data-plan="starter">Start for $1,500</button>', '<a class="btn btn-gold btn-sm header-cta" href="/api/checkout?plan=starter&amp;term=one_time">Start for $1,500</a>')
          t=t.replace('<button type="button" class="btn btn-gold btn-lg" data-plan="starter">Start for $1,500</button>', '<a class="btn btn-gold btn-lg" href="/api/checkout?plan=starter&amp;term=one_time">Start for $1,500</a>')
          t=t.replace('<button type="button" class="btn btn-gold btn-block" data-plan="starter">Start Video Creative — $1,500</button>', '<a class="btn btn-gold btn-block" href="/api/checkout?plan=starter&amp;term=one_time">Start Video Creative — $1,500</a>')
          p.write_text(t)

          # ORVYN is noindex, but give it clean metadata for browser previews/shares.
          p=Path('demo/altura/index.html'); t=p.read_text()
          if 'name="description"' not in t:
              t=t.replace('<title>ORVYN — concept demo by Revenue Pilots</title>', '<title>ORVYN — concept demo by Revenue Pilots</title>\n<meta name="description" content="ORVYN is a fictional interactive website concept created by Revenue Pilots to demonstrate premium web design and motion.">',1)
          p.write_text(t)

          # Checkout success page: keep internal Gmail out of the premium customer-facing surface.
          p=Path('order-success/index.html'); t=p.read_text()
          t=t.replace('<p class="form-fineprint" style="margin-top:24px">Questions? Email <a href="mailto:ostapvinkovskyi@gmail.com">ostapvinkovskyi@gmail.com</a>.</p>', '<p class="form-fineprint" style="margin-top:24px">We’ll follow up using the contact details entered at checkout.</p>')
          p.write_text(t)
          PY

          # Make the homepage service CTA follow the selected service.
          python - <<'PY'
          from pathlib import Path
          p=Path('js/hero-switcher.js'); t=p.read_text()
          t=t.replace('price: "Video Creative — <strong>$1,500</strong>"\n    },', 'price: "Video Creative — <strong>$1,500</strong>",\n      cta: "Start Video Creative — $1,500",\n      checkout: "/api/checkout?plan=starter&term=one_time"\n    },',1)
          t=t.replace('price: "Conversion Website — <strong>$3,500</strong>"\n    },', 'price: "Conversion Website — <strong>$3,500</strong>",\n      cta: "Start Conversion Website — $3,500",\n      checkout: "/api/checkout?plan=website&term=one_time"\n    },',1)
          t=t.replace('price: "Revenue Systems — <strong>$3,500</strong>"\n    }', 'price: "Revenue Systems — <strong>$3,500</strong>",\n      cta: "Start Revenue Systems — $3,500",\n      checkout: "/api/checkout?plan=systems&term=one_time"\n    }',1)
          needle='    var elPrice = document.getElementById("v2Price");\n'
          if needle not in t: raise SystemExit('hero switcher price node not found')
          t=t.replace(needle, needle+'    var elCta = document.getElementById("v2ServiceCta");\n',1)
          needle='      elPrice.innerHTML = c.price;\n'
          if needle not in t: raise SystemExit('hero switcher render point not found')
          t=t.replace(needle, needle+'      if (elCta) { elCta.textContent = c.cta; elCta.setAttribute("href", c.checkout); }\n',1)
          p.write_text(t)
          PY

          node --check js/hero-switcher.js
          node --check js/main.js
          node --check api/checkout.js
          grep -q 'id="v2ServiceCta"' home-v2.html
          grep -q 'plan=website&term=one_time' js/hero-switcher.js
          grep -q 'plan=systems&term=one_time' js/hero-switcher.js
          grep -q 'deliberately hands-on' about/index.html
          grep -q 'name="description"' demo/altura/index.html
          ! grep -q 'ostapvinkovskyi@gmail.com' order-success/index.html
          git diff --check

      - name: Commit final polish
        run: |
          set -euo pipefail
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add home-v2.html js/hero-switcher.js about/index.html video-ads/index.html demo/altura/index.html order-success/index.html
          git diff --cached --check
          git commit -m 'Polish final buyer-facing conversion details'
          git push origin main
