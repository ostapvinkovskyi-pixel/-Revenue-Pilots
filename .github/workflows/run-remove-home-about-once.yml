name: Run homepage About removal once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-remove-home-about-once.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove homepage About block
        run: |
          python scripts/remove_home_about_block.py
          grep -q '<a href="/about/">About me</a>' home-v2.html
          ! grep -q 'Built so the pieces work together.' home-v2.html
      - name: Commit
        run: |
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add home-v2.html
          git commit -m 'Remove About copy from homepage'
          git push origin main
