name: Professional conversion finish once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pro-finish-once.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply professional buyer-facing finish
        run: |
          set -euo pipefail

          cat > api/checkout.js <<'EOF'
          import Stripe from "stripe";

          const OFFERS = {
            starter: {
              slug: "video_creative",
              name: "Revenue Pilots — Video Creative",
              amount: 150000,
              description: "One-time Video Creative package: 3 custom vertical 9:16 ads, 3 distinct hooks/creative angles, creative direction, branding + CTA copy, social-ready exports, and 1 revision round. First drafts within 72 hours after required usable assets are received. Ad spend not included."
            },
            website: {
              slug: "conversion_website",
              name: "Revenue Pilots — Conversion Website",
              amount: 350000,
              description: "One-time Conversion Website package: custom visual direction, responsive build, conversion architecture, lead capture, and core integrations. Custom additions outside the core package are quoted separately."
            },
            systems: {
              slug: "revenue_systems",
              name: "Revenue Pilots — Revenue Systems",
              amount: 350000,
              description: "One-time Revenue Systems package: lead capture workflow, follow-up, booking integration, pipeline/basic CRM, and core automation. Final implementation is limited to supported providers and the agreed core scope; custom additions are quoted separately."
            },
            full_build: {
              slug: "full_revenue_build",
              name: "Revenue Pilots — Full Revenue Build",
              amount: 750000,
              description: "One-time Full Revenue Build: Video Creative, Conversion Website, and Revenue Systems built as one connected core package. Custom additions outside the core package are quoted separately."
            }
          };

          function json(data, status = 200) {
            return Response.json(data, { status });
          }

          export default {
            async fetch(request) {
              if (request.method !== "GET") {
                return json({ error: "Method not allowed" }, 405);
              }

              const secret = process.env.STRIPE_SECRET_KEY;
              if (!secret) {
                return json({ error: "Checkout is not configured yet." }, 503);
              }

              const url = new URL(request.url);
              const plan = url.searchParams.get("plan") || "";
              const term = url.searchParams.get("term");
              const offer = OFFERS[plan];

              if (!offer) {
                return json({ error: "That package is not available for direct checkout." }, 400);
              }
              if (term && term !== "one_time") {
                return json({ error: "Revenue Pilots packages on this page are one-time purchases." }, 400);
              }

              const stripe = new Stripe(secret);
              const origin = process.env.PUBLIC_SITE_URL || url.origin;
              const metadata = {
                plan,
                billing_term: "one_time",
                source: "revenue-pilots-website",
                offer_version: "fixed-packages-2026-09",
                offer: offer.slug
              };

              try {
                const session = await stripe.checkout.sessions.create({
                  mode: "payment",
                  payment_method_types: ["card"],
                  line_items: [{
                    price_data: {
                      currency: "usd",
                      unit_amount: offer.amount,
                      product_data: {
                        name: offer.name,
                        description: offer.description
                      }
                    },
                    quantity: 1
                  }],
                  success_url: `${origin}/order-success/?session_id={CHECKOUT_SESSION_ID}`,
                  cancel_url: `${origin}/#packages`,
                  phone_number_collection: { enabled: true },
                  billing_address_collection: "auto",
                  metadata,
                  payment_intent_data: { metadata }
                });

                return Response.redirect(session.url, 303);
              } catch (error) {
                console.error("Stripe checkout error", error);
                return json({ error: "Checkout could not be started." }, 500);
              }
            }
          };
          EOF

          cat > config/site-config.js <<'EOF'
          // Revenue Pilots — public routing configuration.
          // No secrets live here. Fixed-price package buttons use these local
          // checkout routes; Stripe pricing remains server-owned in api/checkout.js.
          window.RP_CONFIG = {
            CONTACT_EMAIL: "ostapvinkovskyi@gmail.com",
            LEAD_WEBHOOK_URL: "/api/lead",
            STRIPE_STARTER_URL: "/api/checkout?plan=starter&term=one_time",
            STRIPE_WEBSITE_URL: "/api/checkout?plan=website&term=one_time",
            STRIPE_SYSTEMS_URL: "/api/checkout?plan=systems&term=one_time",
            STRIPE_FULL_BUILD_URL: "/api/checkout?plan=full_build&term=one_time"
          };
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          # ---- shared checkout labels: remove obsolete products ----
          p = Path('js/main.js')
          t = p.read_text()
          t, n = re.subn(
              r'  var PLAN_KEYS = \{.*?\n  \};\n  var PLAN_LABELS = \{.*?\n  \};',
              '''  var PLAN_KEYS = {
            starter: "STRIPE_STARTER_URL",
            website: "STRIPE_WEBSITE_URL",
            systems: "STRIPE_SYSTEMS_URL",
            full_build: "STRIPE_FULL_BUILD_URL"
          };
          var PLAN_LABELS = {
            starter: "Video Creative ($1,500)",
            website: "Conversion Website ($3,500)",
            systems: "Revenue Systems ($3,500)",
            full_build: "Full Revenue Build ($7,500)"
          };''',
              t,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Could not replace checkout plan map in js/main.js')
          p.write_text(t)

          # ---- remove the old runtime About-link rewrite; HTML owns navigation ----
          p = Path('js/hero-switcher.js')
          t = p.read_text()
          t, n = re.subn(
              r'    /\* Restore the dedicated founder page.*?\n    \}\);\n\n',
              '',
              t,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Could not remove About runtime rewrite')
          p.write_text(t)

          # ---- globally repair old homepage anchors and stale structured price ----
          for p in Path('.').rglob('*.html'):
              t = p.read_text(errors='replace')
              t = t.replace('/#services', '/#hero')
              t = t.replace('/#pricing', '/#packages')
              t = t.replace('"price":"249"', '"price":"1500"')
              p.write_text(t)

          # ---- homepage: package section is now a real buying surface ----
          p = Path('home-v2.html')
          t = p.read_text()
          t = t.replace('href="#about">About</a>', 'href="/about/">About me</a>')
          t = t.replace(
              '<a class="btn btn-gold btn-sm header-cta" href="#contact">Start a Project</a>',
              '<a class="btn btn-gold btn-sm header-cta" href="#packages">View Packages</a>',
              1,
          )
          t = t.replace(
              '<a class="btn btn-gold" href="#contact">Start a Project</a>',
              '<a class="btn btn-gold" href="#packages">Choose a Package</a>',
              1,
          )
          old = '<button type="button" class="btn btn-gold btn-block" data-plan="starter">Start Video Creative &mdash; $1,500</button>'
          new = '<a class="btn btn-gold btn-block" href="/api/checkout?plan=starter&amp;term=one_time">Start Video Creative &mdash; $1,500</a>\n                <p class="v4-checkout-note">Secure Stripe checkout &middot; one-time payment</p>'
          if old not in t: raise SystemExit('Creative package CTA not found')
          t = t.replace(old, new, 1)

          old = '<a class="btn btn-gold btn-block" href="#contact">Start a Project</a>'
          new = '<a class="btn btn-gold btn-block" href="/api/checkout?plan=website&amp;term=one_time">Start Conversion Website &mdash; $3,500</a>\n                <p class="v4-checkout-note">Secure Stripe checkout &middot; one-time payment</p>'
          if old not in t: raise SystemExit('Website package CTA not found')
          t = t.replace(old, new, 1)

          if old not in t: raise SystemExit('Systems package CTA not found')
          new = '<a class="btn btn-gold btn-block" href="/api/checkout?plan=systems&amp;term=one_time">Start Revenue Systems &mdash; $3,500</a>\n                <p class="v4-checkout-note">Secure Stripe checkout &middot; one-time payment</p>'
          t = t.replace(old, new, 1)

          old = '<a class="btn btn-gold btn-block v4-build-cta" href="#contact"><span>Start My Build</span><span class="v4-build-arrow" aria-hidden="true">→</span></a>'
          new = '<a class="btn btn-gold btn-block v4-build-cta" href="/api/checkout?plan=full_build&amp;term=one_time"><span>Start Full Build &mdash; $7,500</span><span class="v4-build-arrow" aria-hidden="true">→</span></a>\n      <p class="v4-checkout-note v4-checkout-note-center">Secure Stripe checkout &middot; one-time payment</p>'
          if old not in t: raise SystemExit('Full Build CTA not found')
          t = t.replace(old, new, 1)
          p.write_text(t)

          # ---- dedicated fixed-price pages: buy first, question form second ----
          pages = {
              'websites/index.html': {
                  'old_cta':'<a class="btn btn-gold btn-lg" href="#contact">Get a website review</a>',
                  'new_cta':'<a class="btn btn-gold btn-lg" href="/api/checkout?plan=website&amp;term=one_time">Start Conversion Website — $3,500</a>',
                  'old_header':'<a class="btn btn-gold btn-sm header-cta" href="#contact">Get a website review</a>',
                  'new_header':'<a class="btn btn-gold btn-sm header-cta" href="/api/checkout?plan=website&amp;term=one_time">Start Website — $3,500</a>',
                  'old_pitch':'<p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>Get started</p><h2 class="section-title">Tell us what\'s wrong with the site — or what you want built.</h2><p class="section-sub">We review what you have, then send an exact quote. No pressure toward the biggest package.</p>',
                  'new_pitch':'<p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>Questions before buying?</p><h2 class="section-title">Want to confirm fit before you start?</h2><p class="section-sub">The core Conversion Website is available for direct checkout above. For custom scope or a question first, send a note here.</p>',
                  'old_form':'<h3 class="form-heading">Request a website review</h3>',
                  'new_form':'<h3 class="form-heading">Ask about the website build</h3>',
              },
              'systems/index.html': {
                  'old_cta':'<a class="btn btn-gold btn-lg" href="#contact">Scope a systems project</a>',
                  'new_cta':'<a class="btn btn-gold btn-lg" href="/api/checkout?plan=systems&amp;term=one_time">Start Revenue Systems — $3,500</a>',
                  'old_header':'<a class="btn btn-gold btn-sm header-cta" href="#contact">Scope a systems project</a>',
                  'new_header':'<a class="btn btn-gold btn-sm header-cta" href="/api/checkout?plan=systems&amp;term=one_time">Start Systems — $3,500</a>',
                  'old_pitch':'<p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>Get started</p><h2 class="section-title">Tell us where leads are falling through.</h2><p class="section-sub">The core Revenue Systems package is $3,500. We review your current stack and confirm what is included before work begins.</p>',
                  'new_pitch':'<p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>Questions before buying?</p><h2 class="section-title">Need to confirm your stack or scope first?</h2><p class="section-sub">The $3,500 core Revenue Systems package is available for direct checkout above. For provider compatibility or custom scope, ask here first.</p>',
                  'old_form':'<h3 class="form-heading">Scope a systems project</h3>',
                  'new_form':'<h3 class="form-heading">Ask about Revenue Systems</h3>',
              },
              'full-build/index.html': {
                  'old_cta':'<a class="btn btn-gold btn-lg" href="#contact">Start a project brief</a>',
                  'new_cta':'<a class="btn btn-gold btn-lg" href="/api/checkout?plan=full_build&amp;term=one_time">Start Full Revenue Build — $7,500</a>',
                  'old_header':'<a class="btn btn-gold btn-sm header-cta" href="#contact">Start a project brief</a>',
                  'new_header':'<a class="btn btn-gold btn-sm header-cta" href="/api/checkout?plan=full_build&amp;term=one_time">Start Full Build — $7,500</a>',
                  'old_pitch':'<p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>Get started</p><h2 class="section-title">Start with a discovery conversation.</h2><p class="section-sub">Tell us about the business and what you want the build to do. We\'ll follow up to scope it properly — this isn\'t an instant checkout.</p>',
                  'new_pitch':'<p class="eyebrow"><span class="eyebrow-dash" aria-hidden="true"></span>Questions before buying?</p><h2 class="section-title">Want to confirm fit before the full build?</h2><p class="section-sub">The $7,500 core Full Revenue Build is available for direct checkout above. If you need custom additions or want to confirm fit first, send the project brief here.</p>',
                  'old_form':'<h3 class="form-heading">Start a project brief</h3>',
                  'new_form':'<h3 class="form-heading">Ask about the Full Revenue Build</h3>',
              },
          }
          for file, r in pages.items():
              p = Path(file); t = p.read_text()
              for a,b in [(r['old_header'],r['new_header']),(r['old_cta'],r['new_cta']),(r['old_pitch'],r['new_pitch']),(r['old_form'],r['new_form'])]:
                  if a not in t: raise SystemExit(f'Expected copy not found in {file}: {a[:70]}')
                  t = t.replace(a,b,1)
              # Put a low-friction question link beside the primary purchase CTA.
              marker = r['new_cta']
              t = t.replace(marker, marker + '\n      <a class="btn btn-ghost btn-lg" href="#contact">Ask a question first</a>', 1)
              p.write_text(t)

          # ORVYN is a portfolio demo, not an SEO landing page.
          p = Path('demo/altura/index.html')
          t = p.read_text()
          if 'name="robots"' not in t:
              t = t.replace('<meta name="viewport" content="width=device-width, initial-scale=1">', '<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta name="robots" content="noindex,nofollow">', 1)
          p.write_text(t)

          # Fresh lastmod dates for the pages changed in this production pass.
          p = Path('sitemap.xml')
          t = p.read_text()
          for route in ('/','/video-ads/','/websites/','/systems/','/full-build/','/short-form-video-ads/'):
              if route == '/':
                  pattern = r'(<loc>https://www\.revenuepilot\.company/</loc><lastmod>)[^<]+'
              else:
                  pattern = r'(<loc>https://www\.revenuepilot\.company' + re.escape(route) + r'</loc><lastmod>)[^<]+'
              t = re.sub(pattern, r'\g<1>2026-09-06', t)
          p.write_text(t)
          PY

          cat >> css/v4.css <<'EOF'

          /* PROFESSIONAL CHECKOUT FINISH — Sep 6 */
          #packages .v4-checkout-note{
            margin:10px 0 0;
            color:rgba(221,224,231,.48);
            font-size:11px;
            line-height:1.4;
            letter-spacing:.015em;
          }
          #packages .v4-checkout-note::before{
            content:"✓";
            margin-right:6px;
            color:rgba(240,216,154,.72);
            font-weight:800;
          }
          #packages .v4-checkout-note-center{ text-align:center; }
          @media(max-width:760px){
            #packages .v4-checkout-note{ font-size:10.5px; }
          }
          EOF

          mkdir -p order-success
          cat > order-success/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>Checkout complete — Revenue Pilots</title>
          <meta name="description" content="Revenue Pilots checkout confirmation and next steps.">
          <meta name="theme-color" content="#07090D">
          <link rel="icon" href="../assets/brand/rp-monogram.png">
          <link rel="apple-touch-icon" href="../assets/brand/rp-monogram.png">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
          <link rel="stylesheet" href="../css/styles.css">
          <link rel="stylesheet" href="../css/site-v2.css">
          </head>
          <body>
          <main id="main">
            <section class="section" style="min-height:100vh;display:grid;place-items:center;padding:clamp(48px,8vw,96px) 0;">
              <div class="shell" style="max-width:860px;text-align:center;">
                <a class="brand" href="/" aria-label="Revenue Pilots — home" style="display:inline-flex;margin-bottom:42px;">
                  <span class="brand-badge"><img src="../assets/brand/rp-monogram.png" alt="" width="320" height="320"></span>
                  <span class="brand-name">Revenue Pilots</span>
                </a>
                <p class="eyebrow" style="justify-content:center;">CHECKOUT COMPLETE</p>
                <h1 class="section-title" style="max-width:14ch;margin:12px auto 18px;font-size:clamp(42px,7vw,72px);">Welcome aboard.</h1>
                <p class="section-sub" style="max-width:58ch;margin:0 auto;">Your checkout has returned successfully. We’ll use the contact details entered at checkout for the next step. If there is anything we should know before we begin, send it now.</p>
                <div class="hero-v3-actions" style="justify-content:center;margin-top:30px;">
                  <a class="btn btn-gold btn-lg" href="/#contact">Send project details</a>
                  <a class="btn btn-ghost btn-lg" href="/">Back to Revenue Pilots</a>
                </div>
                <p class="form-fineprint" style="margin-top:24px;">Questions? Email <a href="mailto:ostapvinkovskyi@gmail.com">ostapvinkovskyi@gmail.com</a>.</p>
              </div>
            </section>
          </main>
          </body>
          </html>
          EOF

          # One-time audit/workflow residue should not remain in the production repo.
          rm -f .github/workflows/pro-audit-once.yml
          rm -f .github/workflows/pro-finish-once.yml
          rm -f .github/workflows/install-owned-hero-loop.yml
          rm -f .github/workflows/remove-empty-portfolio-slides.yml

          # ---- production validation ----
          node --check api/checkout.js
          for f in js/*.js api/*.js; do node --check "$f"; done
          grep -q 'plan=website' api/checkout.js
          grep -q 'plan=systems' home-v2.html
          grep -q 'plan=full_build' home-v2.html
          grep -q 'plan=website' websites/index.html
          grep -q 'plan=systems' systems/index.html
          grep -q 'plan=full_build' full-build/index.html
          ! grep -R --include='*.html' -n '"price":"249"' .
          ! grep -R --include='*.html' -n '/#services' .
          ! grep -R --include='*.html' -n '/#pricing' .
          ! grep -n 'Growth (\$499)\|Weekly Ad Engine' js/main.js
          test -f order-success/index.html
          git diff --check

      - name: Commit professional finish
        run: |
          set -euo pipefail
          git config user.name 'Revenue Pilots Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finish direct checkout and buyer experience'
          git push origin main
