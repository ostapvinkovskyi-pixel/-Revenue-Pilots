name: Revenue Pilots Preview QA

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.ref, 'rp/build-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture preview context
        shell: bash
        run: |
          set -euo pipefail
          echo "PREVIEW_URL=${{ github.event.deployment_status.environment_url }}" >> "$GITHUB_ENV"
          echo "BUILD_BRANCH=${{ github.event.deployment.ref }}" >> "$GITHUB_ENV"

      - name: Verify preview URL exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "Vercel deployment succeeded but no environment URL was provided."
            exit 1
          fi

      - name: HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -L -sS -o /tmp/preview.html -w "%{http_code}" --max-time 30 "$PREVIEW_URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Preview returned unacceptable HTTP status $STATUS"
            exit 1
          fi
          if grep -Eqi 'Internal Server Error|Application error|This page could not be found' /tmp/preview.html; then
            echo "Preview contains a known fatal-error marker."
            exit 1
          fi
          if ! grep -Eqi '<html|<!doctype html' /tmp/preview.html; then
            echo "Preview response does not look like an HTML website."
            exit 1
          fi

      - name: Record QA result on pull request
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BUILD_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR found for $BUILD_BRANCH; skipping PR comment."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Builder Pilot Preview QA ✅\n\nPreview: $PREVIEW_URL\n\nChecks passed: Vercel deployment ready, HTTP response healthy, no common fatal-error page detected. Production remains owner-gated."
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Builder Pilot Preview QA ❌\n\nPreview: $PREVIEW_URL\n\nAutomated smoke QA failed. Do not merge/deploy production until the failure is investigated and QA passes."
          fi
