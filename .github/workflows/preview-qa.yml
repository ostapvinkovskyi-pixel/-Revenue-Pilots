name: Revenue Pilots Preview QA

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  preview-smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve Builder preview context
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -euo pipefail
          PREVIEW_URL="$TARGET_URL"
          if [ -z "$PREVIEW_URL" ]; then PREVIEW_URL="$ENVIRONMENT_URL"; fi

          PR_DATA=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName,headRefOid \
            --jq ".[] | select(.headRefOid == \"$DEPLOY_SHA\") | [.number,.headRefName] | @tsv" | head -n1 || true)

          if [ -z "$PR_DATA" ]; then
            echo "No open PR matches deployment SHA $DEPLOY_SHA; this is not an active Builder review."
            echo "is_builder=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(printf '%s' "$PR_DATA" | cut -f1)
          BUILD_BRANCH=$(printf '%s' "$PR_DATA" | cut -f2)
          if [[ "$BUILD_BRANCH" != rp/build-* ]]; then
            echo "PR #$PR_NUMBER is not a Builder Pilot branch; skipping Builder QA."
            echo "is_builder=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is_builder=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_branch=$BUILD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve Vercel preview URL
        id: preview
        shell: bash
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -euo pipefail
          # Runs for every successful Preview deployment, Builder or not: the
          # deployment boundary belongs to the project, not to one PR type.
          PREVIEW_URL="${TARGET_URL:-}"
          if [ -z "$PREVIEW_URL" ]; then PREVIEW_URL="${ENVIRONMENT_URL:-}"; fi
          if [ -z "$PREVIEW_URL" ]; then
            echo "Vercel deployment succeeded but no preview URL was provided."
            exit 1
          fi
          echo "url=${PREVIEW_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Deployment boundary check (internal files must not be public)
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
            exit 1
          fi
          BASE="${PREVIEW_URL%/}"
          status() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "$BASE$1"
          }

          # Controls: public runtime files must be reachable. This also proves the
          # bypass header worked, so a 404/401 below cannot be a false pass.
          for p in / /config/site-config.js /robots.txt; do
            s=$(status "$p")
            if [ "$s" != "200" ]; then
              echo "Control path $p returned HTTP $s (expected 200); boundary check is not trustworthy."
              exit 1
            fi
          done

          # Repository/internal files that must never be served as static files.
          LEAKS=0
          for p in \
            /AGENTS.md /CLAUDE.md /CONTEXT.md /README.md /DEPLOY_TOMORROW.md \
            /docs/agents/domain.md \
            /assets/engine/PROVENANCE.md \
            /.github/workflows/preview-qa.yml /.github/workflows/production-gate.yml \
            /.revenue-pilots/README.md /.revenue-pilots/OWNER_APPROVAL_POLICY.md \
            /.revenue-pilots/SECURITY_NOTES.md \
            /.deploy-trigger-website-pricing /deploy-refresh.html \
            /config/site-config.example.js /.env.example \
            /.vercelignore /.git/config
          do
            s=$(status "$p")
            case "$s" in
              2??) echo "LEAK: $p is publicly served (HTTP $s)"; LEAKS=$((LEAKS + 1)) ;;
              *)   echo "ok:   $p -> HTTP $s" ;;
            esac
          done
          if [ "$LEAKS" -ne 0 ]; then
            echo "$LEAKS internal path(s) are publicly served. Add them to .vercelignore."
            exit 1
          fi

      - name: Verify preview URL exists
        if: steps.context.outputs.is_builder == 'true'
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.context.outputs.preview_url }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "Vercel deployment succeeded but no preview URL was provided."
            exit 1
          fi

      - name: HTTP smoke test
        if: steps.context.outputs.is_builder == 'true'
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.context.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
            exit 1
          fi

          # For a one-shot smoke request, send only the documented bypass header.
          # Do not request a bypass cookie here: doing so without a cookie jar can
          # create a redirect loop on protected previews.
          RESULT=$(curl -sS -D /tmp/preview.headers -o /tmp/preview.html \
            -w "%{http_code}\t%{redirect_url}" --max-time 30 \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "$PREVIEW_URL")

          STATUS=${RESULT%%$'\t'*}
          REDIRECT_URL=${RESULT#*$'\t'}
          echo "HTTP status: $STATUS"

          if [ "$STATUS" -ge 300 ] && [ "$STATUS" -lt 400 ]; then
            if [[ "$REDIRECT_URL" == *"vercel.com/login"* ]] || [[ "$REDIRECT_URL" == *"vercel.com/sso-api"* ]]; then
              echo "Preview is still behind Vercel Deployment Protection; bypass secret was not accepted."
            else
              echo "Preview returned an unexpected redirect: $REDIRECT_URL"
            fi
            exit 1
          fi

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Preview returned unacceptable HTTP status $STATUS."
            exit 1
          fi

          if grep -Eqi 'Vercel Authentication|Log in to Vercel|_vercel_sso_nonce|sso-api' /tmp/preview.html /tmp/preview.headers; then
            echo "Preview response still contains Vercel Authentication markers."
            exit 1
          fi

          if grep -Eqi 'Internal Server Error|Application error|This page could not be found|NOT_FOUND' /tmp/preview.html; then
            echo "Preview contains a known fatal-error marker."
            exit 1
          fi
          if ! grep -Eqi '<html|<!doctype html' /tmp/preview.html; then
            echo "Preview response does not look like an HTML website."
            exit 1
          fi

      - name: Record QA result on pull request
        if: always() && steps.context.outputs.is_builder == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.context.outputs.preview_url }}
          DEPLOY_SHA: ${{ steps.context.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Builder Pilot Preview QA ✅\n\nPreview: $PREVIEW_URL\nCommit: $DEPLOY_SHA\n\nChecks passed: Vercel Preview deployment succeeded, live HTTP response is healthy, page looks like HTML, and no common fatal-error page was detected. Production remains owner-gated for this exact commit."
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Builder Pilot Preview QA ❌\n\nPreview: $PREVIEW_URL\nCommit: $DEPLOY_SHA\n\nAutomated live-preview QA did not pass. Production remains blocked until the failure is fixed and QA passes for the exact reviewed commit."
            exit 1
          fi
