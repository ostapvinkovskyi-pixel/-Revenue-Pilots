name: Run premium pricing update once

on:
  push:
    paths:
      - '.github/workflows/run-premium-pricing-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply premium pricing patch
        run: python scripts/add_premium_pricing.py
      - name: Commit changes
        run: |
          git config user.name "Revenue Pilots Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add home-v2.html websites/index.html full-build/index.html css/premium-pricing.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add cinematic and signature website pricing"
          git push
